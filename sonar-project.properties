sonar.projectKey=jadli-springboot
sonar.projectName=JADLI Online Bookstore (Spring Boot)
sonar.projectVersion=0.1.0

# The server defaults to http://localhost:9000 (override with -Dsonar.host.url=...).
# Never put a token in this file: pass -Dsonar.token=... or set the SONAR_TOKEN environment variable.

sonar.sources=src/main/java,src/main/resources
sonar.tests=src/test/java
sonar.sourceEncoding=UTF-8

sonar.java.source=17
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
