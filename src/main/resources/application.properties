spring.application.name=bookstore
server.port=8080

spring.datasource.url=jdbc:h2:mem:bookstore;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.env.show-values=ALWAYS

bookstore.name=Paper and Pixels
bookstore.currency=EUR
bookstore.mail.sender=shop@example.com
bookstore.storage.covers=./covers
bookstore.payments.callback=http://localhost:8080/api/payments/callback
